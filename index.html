<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>EGC 游戏厅</title>
<meta name="description" content="EGC Arcade — Snake / 2048 / Reaction / Aim / Guess">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#07070f;
  --text:#eef0ff;
  --muted:#8b8fa8;
  --stroke:rgba(255,255,255,.09);
  --acc1:#7c5cff;
  --acc2:#00e5ff;
  --acc3:#ff4d9d;
  --scroll:0;
  --sidebar:300px;
}
html{scroll-behavior:smooth}
body{
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
  background:var(--bg);color:var(--text);min-height:100vh;overflow-x:hidden;
  -webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent;
}
body::before{
  content:"";position:fixed;inset:0;z-index:-2;pointer-events:none;
  background:
    radial-gradient(900px 620px at 12% -8%,rgba(124,92,255,.28),transparent 62%),
    radial-gradient(760px 520px at 92% 0%,rgba(0,229,255,.16),transparent 62%),
    radial-gradient(700px 700px at 50% 110%,rgba(255,77,157,.14),transparent 62%);
}
body::after{
  content:"";position:fixed;inset:0;z-index:-1;pointer-events:none;opacity:.35;
  background-image:linear-gradient(rgba(255,255,255,.03) 1px,transparent 1px),
    linear-gradient(90deg,rgba(255,255,255,.03) 1px,transparent 1px);
  background-size:72px 72px;
  mask-image:radial-gradient(ellipse at 50% 20%,#000 20%,transparent 72%);
}
::selection{background:rgba(124,92,255,.4)}
button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit}
input{font-family:inherit}
a{color:inherit;text-decoration:none}

.site-header{
  position:fixed;top:0;left:0;right:0;z-index:120;
  display:flex;align-items:center;justify-content:space-between;
  padding:18px 28px;gap:12px;
  transition:padding .35s cubic-bezier(.2,.8,.2,1),background .35s ease,border-color .35s ease;
  border-bottom:1px solid transparent;
}
.site-header.scrolled{
  padding:10px 28px;
  background:rgba(9,9,18,.74);
  -webkit-backdrop-filter:blur(20px) saturate(160%);
  backdrop-filter:blur(20px) saturate(160%);
  border-bottom-color:rgba(255,255,255,.07);
}
.header-left,.header-right{display:flex;align-items:center;gap:10px;min-width:120px}
.header-right{justify-content:flex-end}
.icon-btn{
  width:42px;height:42px;border-radius:13px;
  display:grid;place-items:center;
  background:rgba(255,255,255,.06);
  border:1px solid rgba(255,255,255,.1);
  color:#e8eaff;transition:transform .2s ease,background .2s ease,border-color .2s ease;
}
.icon-btn:hover{background:rgba(124,92,255,.2);border-color:rgba(124,92,255,.45);transform:translateY(-1px)}
.icon-btn svg{width:20px;height:20px;display:block}
.logo{display:flex;align-items:center;gap:10px;user-select:none}
.logo-mark{
  width:36px;height:36px;border-radius:12px;display:grid;place-items:center;
  background:linear-gradient(145deg,#7c5cff,#00e5ff);
  box-shadow:0 8px 22px -8px rgba(124,92,255,.9);
  font-weight:900;font-size:13px;color:#fff;letter-spacing:.04em;
}
.logo-text{
  font-size:22px;font-weight:900;letter-spacing:.14em;line-height:1;
  background:linear-gradient(115deg,#fff 0%,#a99cff 45%,#5ee7ff 100%);
  -webkit-background-clip:text;background-clip:text;color:transparent;
}
.lang-wrap{position:relative}
.lang-menu{
  position:absolute;top:calc(100% + 10px);right:0;min-width:168px;
  padding:8px;border-radius:16px;
  background:rgba(16,16,28,.94);
  border:1px solid rgba(255,255,255,.1);
  box-shadow:0 24px 50px -20px rgba(0,0,0,.8);
  -webkit-backdrop-filter:blur(16px);backdrop-filter:blur(16px);
  opacity:0;pointer-events:none;transform:translateY(-6px) scale(.98);
  transition:opacity .2s ease,transform .2s ease;
}
.lang-menu.open{opacity:1;pointer-events:auto;transform:none}
.lang-item{
  width:100%;text-align:left;padding:10px 12px;border-radius:11px;
  display:flex;align-items:center;justify-content:space-between;gap:10px;
  font-size:14px;font-weight:650;color:#c9cde4;
}
.lang-item:hover{background:rgba(255,255,255,.06);color:#fff}
.lang-item.active{background:rgba(124,92,255,.2);color:#fff}
.lang-item small{color:#8b8fa8;font-weight:600}

.scrim{
  position:fixed;inset:0;z-index:180;background:rgba(4,4,10,.55);
  opacity:0;pointer-events:none;transition:opacity .3s ease;
}
.scrim.open{opacity:1;pointer-events:auto}
.sidebar{
  position:fixed;top:0;left:0;bottom:0;z-index:190;width:min(var(--sidebar),88vw);
  padding:22px 18px 28px;
  background:linear-gradient(180deg,#141422 0%,#0c0c16 100%);
  border-right:1px solid rgba(255,255,255,.08);
  box-shadow:24px 0 70px rgba(0,0,0,.45);
  transform:translateX(-105%);
  transition:transform .38s cubic-bezier(.2,.8,.2,1);
  display:flex;flex-direction:column;gap:18px;
}
.sidebar.open{transform:none}
.side-head{display:flex;align-items:center;justify-content:space-between}
.side-title{font-size:13px;letter-spacing:.16em;text-transform:uppercase;color:#8b8fa8;font-weight:700}
.side-nav{display:flex;flex-direction:column;gap:10px}
.side-link{
  display:flex;align-items:center;gap:12px;
  padding:14px 14px;border-radius:16px;
  background:rgba(255,255,255,.04);
  border:1px solid rgba(255,255,255,.07);
  transition:transform .2s ease,border-color .2s ease,background .2s ease;
}
.side-link:hover{transform:translateX(4px);border-color:rgba(124,92,255,.45);background:rgba(124,92,255,.1)}
.side-ico{
  width:40px;height:40px;border-radius:12px;display:grid;place-items:center;flex:none;
  background:rgba(255,255,255,.06);
}
.side-ico svg{width:20px;height:20px}
.side-link b{display:block;font-size:14px}
.side-link span{display:block;font-size:12px;color:var(--muted);margin-top:2px}
.side-note{margin-top:auto;font-size:12px;color:#5c6078;line-height:1.55}

.hero{max-width:1120px;margin:0 auto;padding:132px 24px 36px;text-align:center}
.hero-badge{
  display:inline-flex;align-items:center;gap:8px;
  padding:7px 16px;border-radius:999px;margin-bottom:22px;
  border:1px solid rgba(124,92,255,.4);background:rgba(124,92,255,.11);
  color:#bfb2ff;font-size:13px;font-weight:600;
  animation:fadeUp .7s cubic-bezier(.2,.8,.2,1) both;
}
.hero-badge::before{
  content:"";width:7px;height:7px;border-radius:50%;background:#54f0a0;
  box-shadow:0 0 10px #54f0a0;animation:blink 1.8s ease-in-out infinite;
}
@keyframes blink{0%,100%{opacity:1}50%{opacity:.25}}
.hero-title{
  font-size:clamp(36px,6vw,68px);font-weight:900;line-height:1.04;letter-spacing:-.03em;
  background:linear-gradient(180deg,#ffffff 20%,#8e93bd 100%);
  -webkit-background-clip:text;background-clip:text;color:transparent;
  animation:fadeUp .7s .06s cubic-bezier(.2,.8,.2,1) both;
}
.hero-subtitle{
  max-width:620px;margin:18px auto 0;color:var(--muted);
  font-size:clamp(15px,1.7vw,17.5px);line-height:1.65;
  animation:fadeUp .7s .12s cubic-bezier(.2,.8,.2,1) both;
}
.hero-stats{display:flex;justify-content:center;gap:14px;flex-wrap:wrap;margin-top:30px;animation:fadeUp .7s .18s both}
.stat{min-width:104px;padding:14px 20px;border-radius:16px;background:rgba(255,255,255,.045);border:1px solid var(--stroke)}
.stat strong{display:block;font-size:21px;font-weight:800;background:linear-gradient(135deg,#fff,#a99cff);-webkit-background-clip:text;background-clip:text;color:transparent}
.stat span{font-size:12px;color:var(--muted);letter-spacing:.04em}
@keyframes fadeUp{from{opacity:0;transform:translateY(22px)}to{opacity:1;transform:none}}

.games-grid{
  display:grid;grid-template-columns:repeat(2,minmax(0,1fr));
  gap:22px;max-width:1120px;margin:0 auto;padding:8px 24px 90px;
}
@media(max-width:760px){
  .games-grid{grid-template-columns:1fr;gap:16px;padding-bottom:60px}
  .site-header,.site-header.scrolled{padding-left:16px;padding-right:16px}
  .hero{padding:118px 18px 28px}
  .header-left,.header-right{min-width:0}
  .logo-text{display:none}
}
.game-card{
  position:relative;border-radius:24px;overflow:hidden;cursor:pointer;
  background:linear-gradient(165deg,rgba(255,255,255,.07),rgba(255,255,255,.02));
  border:1px solid var(--stroke);
  transition:transform .45s cubic-bezier(.2,.8,.2,1),border-color .45s ease,box-shadow .45s ease;
  animation:fadeUp .7s cubic-bezier(.2,.8,.2,1) both;
  outline:none;
}
.game-card:nth-child(1){animation-delay:.08s}
.game-card:nth-child(2){animation-delay:.14s}
.game-card:nth-child(3){animation-delay:.2s}
.game-card:nth-child(4){animation-delay:.26s}
.game-card:nth-child(5){animation-delay:.32s}
.game-card:hover,.game-card:focus-visible{
  transform:translateY(-8px);
  border-color:rgba(124,92,255,.55);
  box-shadow:0 30px 70px -28px rgba(124,92,255,.8);
}
.card-preview{position:relative;height:196px;overflow:hidden;border-bottom:1px solid rgba(255,255,255,.06)}
.card-preview canvas{display:block;width:100%;height:100%}
.card-body{padding:18px 20px 20px}
.card-head{display:flex;align-items:center;justify-content:space-between;gap:10px}
.card-head h3{font-size:20px;font-weight:800}
.card-tag{
  font-size:11px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;
  padding:4px 10px;border-radius:999px;color:#a99cff;
  background:rgba(124,92,255,.14);border:1px solid rgba(124,92,255,.28);white-space:nowrap;
}
.card-desc{margin-top:8px;color:var(--muted);font-size:13.5px;line-height:1.55}
.card-cta{display:inline-flex;align-items:center;gap:7px;margin-top:14px;font-size:13.5px;font-weight:700}
.card-cta .cta-arrow{transition:transform .35s cubic-bezier(.2,.8,.2,1)}
.game-card:hover .cta-arrow{transform:translateX(6px)}

.modal-overlay{
  position:fixed;inset:0;z-index:200;display:flex;align-items:center;justify-content:center;
  padding:18px;background:rgba(4,4,10,.84);
  -webkit-backdrop-filter:blur(16px);backdrop-filter:blur(16px);
  opacity:0;pointer-events:none;transition:opacity .3s ease;
}
.modal-overlay.open{opacity:1;pointer-events:auto}
.modal{
  width:100%;max-width:560px;max-height:92vh;overflow-y:auto;
  padding:20px;border-radius:24px;
  background:linear-gradient(170deg,#161622,#0c0c15);
  border:1px solid rgba(255,255,255,.1);
  box-shadow:0 44px 110px -32px rgba(0,0,0,.95);
  transform:translateY(24px) scale(.965);
  transition:transform .38s cubic-bezier(.2,.8,.2,1);
}
.modal-overlay.open .modal{transform:none}
.modal-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px}
.modal-head h2{font-size:20px;font-weight:800}
.close-btn{
  width:34px;height:34px;border-radius:11px;color:var(--muted);
  background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.08);
  display:grid;place-items:center;
}
.close-btn:hover{background:rgba(255,77,157,.16);color:#ff8ab8}
.hud{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin-bottom:14px}
.hud-item{min-width:86px;padding:9px 16px;border-radius:13px;text-align:center;background:rgba(255,255,255,.05);border:1px solid var(--stroke)}
.hud-label{display:block;font-size:10.5px;color:var(--muted);letter-spacing:.07em;text-transform:uppercase;margin-bottom:3px}
.hud-val{font-size:19px;font-weight:800;font-variant-numeric:tabular-nums}
.game-hint{text-align:center;color:var(--muted);font-size:12.5px;margin-top:14px;line-height:1.5}
.btn-primary{
  padding:11px 26px;border-radius:12px;font-size:14px;font-weight:700;color:#fff;
  background:linear-gradient(135deg,var(--acc1),#5b7cff);
  box-shadow:0 10px 26px -10px rgba(124,92,255,.95);
}
.btn-primary:hover{transform:translateY(-2px)}
.btn-ghost{padding:9px 20px;border-radius:11px;font-size:13px;font-weight:600;color:#c8cbdd;background:rgba(255,255,255,.06);border:1px solid var(--stroke)}
.snake-stage{
  position:relative;width:min(100%,440px);aspect-ratio:1;margin:0 auto;border-radius:18px;overflow:hidden;
  background:radial-gradient(circle at 50% 40%,#16162a,#090912);border:1px solid rgba(255,255,255,.08);touch-action:none;
}
.snake-stage canvas{display:block;width:100%;height:100%}
.game-over-panel{
  position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;
  background:rgba(8,8,16,.82);-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px);
}
.game-over-panel.hidden{display:none}
.game-over-panel h3{font-size:24px;font-weight:900}
.game-over-panel .final-score{color:var(--muted)}
.game-over-panel .final-score b{color:#a99cff;font-size:18px}
.board2048{
  display:grid;grid-template-columns:repeat(4,1fr);gap:8px;
  width:min(100%,380px);aspect-ratio:1;margin:0 auto;padding:10px;border-radius:18px;
  background:linear-gradient(160deg,#1c1c2c,#12121c);
  border:1px solid rgba(255,255,255,.07);container-type:inline-size;
  box-shadow:inset 0 1px 0 rgba(255,255,255,.06),0 18px 40px -24px rgba(0,0,0,.8);
}
.tcell{position:relative;border-radius:12px;background:rgba(255,255,255,.04);box-shadow:inset 0 2px 6px rgba(0,0,0,.35)}
.tile{
  position:absolute;inset:0;border-radius:12px;display:flex;align-items:center;justify-content:center;
  font-weight:900;letter-spacing:-.04em;font-size:8.2cqw;color:#fff;
  animation:tilePop .18s cubic-bezier(.2,.8,.2,1) both;
  box-shadow:0 8px 16px -8px rgba(0,0,0,.65),inset 0 1px 0 rgba(255,255,255,.35);
}
@keyframes tilePop{from{transform:scale(.55);opacity:.3}to{transform:scale(1);opacity:1}}
.tile[data-v="2"]{background:linear-gradient(160deg,#f7f1e8,#e7dccb);color:#776e65}
.tile[data-v="4"]{background:linear-gradient(160deg,#f3e6cf,#e4d0ad);color:#776e65}
.tile[data-v="8"]{background:linear-gradient(160deg,#ffc48d,#e89555)}
.tile[data-v="16"]{background:linear-gradient(160deg,#ffb07a,#e07a45)}
.tile[data-v="32"]{background:linear-gradient(160deg,#ff9478,#e15d45)}
.tile[data-v="64"]{background:linear-gradient(160deg,#ff7a58,#d8442c)}
.tile[data-v="128"]{background:linear-gradient(160deg,#ffe08a,#e6b84a);color:#fff}
.tile[data-v="256"]{background:linear-gradient(160deg,#ffe06a,#e0b43a)}
.tile[data-v="512"]{background:linear-gradient(160deg,#ffd84e,#d4a428)}
.tile[data-v="1024"]{background:linear-gradient(160deg,#ffd23a,#c8961c);font-size:6.4cqw}
.tile[data-v="2048"]{background:linear-gradient(160deg,#ffe14a,#f0b400);font-size:6.4cqw;box-shadow:0 0 26px rgba(237,194,46,.75)}
.row-actions{display:flex;justify-content:center;margin-top:16px}
.reaction-stage{
  position:relative;width:100%;height:280px;border-radius:20px;
  display:flex;align-items:center;justify-content:center;text-align:center;
  background:radial-gradient(circle at 50% 45%,#2a1830,#120c16);
  border:1px solid rgba(255,255,255,.08);cursor:pointer;user-select:none;padding:20px;
  box-shadow:inset 0 0 80px rgba(255,60,90,.18);
}
.reaction-stage.waiting{background:radial-gradient(circle at 50% 45%,#4a1a28,#1a0c12);box-shadow:inset 0 0 90px rgba(255,60,90,.4)}
.reaction-stage.ready{background:radial-gradient(circle at 50% 45%,#14663c,#071910);box-shadow:inset 0 0 90px rgba(60,255,150,.45),0 0 40px -10px rgba(60,255,150,.5)}
.r-text{font-size:clamp(20px,4.4vw,28px);font-weight:900}
.aim-stage{
  position:relative;width:100%;aspect-ratio:4/3;max-height:360px;border-radius:20px;overflow:hidden;
  background:
    radial-gradient(circle at 50% 40%,rgba(0,229,255,.08),transparent 50%),
    linear-gradient(#101826,#0a1018);
  border:1px solid rgba(255,255,255,.08);cursor:crosshair;touch-action:manipulation;
}
.aim-target{
  position:absolute;border-radius:50%;cursor:pointer;
  background:radial-gradient(circle at 32% 28%,#fff6c2,#ffb347 28%,#ff5d5d 70%,#9b1d3a);
  box-shadow:0 10px 18px rgba(0,0,0,.35),0 0 22px rgba(255,107,107,.65),inset 0 -8px 12px rgba(0,0,0,.25);
  animation:aimPop .16s cubic-bezier(.2,.8,.2,1) both;
}
.aim-target::after{
  content:"";position:absolute;inset:18%;border-radius:50%;border:2px solid rgba(255,255,255,.55);
  box-shadow:inset 0 0 0 6px rgba(255,255,255,.12);
}
@keyframes aimPop{from{transform:scale(.2);opacity:0}to{transform:scale(1);opacity:1}}
.aim-overlay{
  position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;
  background:rgba(8,12,20,.82);-webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px);
}
.aim-overlay.hidden{display:none}
.aim-overlay p{color:var(--muted);font-size:13.5px;text-align:center;padding:0 20px;line-height:1.6}
.aim-time{position:absolute;top:10px;right:14px;font-size:14px;font-weight:800;color:#8ef0ff;pointer-events:none}
.guess-box{width:100%;max-width:420px;margin:0 auto;text-align:center}
.guess-range{
  display:inline-block;padding:7px 18px;border-radius:999px;margin-bottom:16px;
  font-size:13px;font-weight:700;color:#a99cff;background:rgba(124,92,255,.13);border:1px solid rgba(124,92,255,.3);
}
.guess-input-row{display:flex;gap:10px}
.guess-input{
  flex:1;padding:14px 18px;border-radius:14px;font-size:19px;font-weight:800;
  background:rgba(255,255,255,.06);border:1px solid var(--stroke);color:#fff;outline:none;text-align:center;
  -moz-appearance:textfield;
}
.guess-input::-webkit-outer-spin-button,.guess-input::-webkit-inner-spin-button{-webkit-appearance:none;margin:0}
.guess-input:focus{border-color:rgba(124,92,255,.7);box-shadow:0 0 0 4px rgba(124,92,255,.16)}
.guess-feedback{min-height:52px;margin-top:16px;font-size:16px;font-weight:800;display:flex;align-items:center;justify-content:center}
.guess-feedback.low{color:#6ec8ff}
.guess-feedback.high{color:#ff9a6b}
.guess-feedback.win{color:#5ef0a0}
.guess-feedback.err{color:#ff6b8b;font-size:14px}
.guess-history{display:flex;flex-wrap:wrap;gap:7px;justify-content:center;margin-top:6px}
.gh-chip{padding:5px 12px;border-radius:9px;font-size:12.5px;font-weight:700;background:rgba(255,255,255,.055);border:1px solid var(--stroke);color:#b9bdd6}
.gh-chip.up{color:#ff9a6b;border-color:rgba(255,154,107,.28)}
.gh-chip.down{color:#6ec8ff;border-color:rgba(110,200,255,.28)}
.site-footer{text-align:center;padding:0 24px 56px;color:#4d5169;font-size:12.5px}
.modal::-webkit-scrollbar{width:8px}
.modal::-webkit-scrollbar-thumb{background:rgba(255,255,255,.12);border-radius:8px}
</style>
</head>
<body>

<div class="scrim" id="scrim"></div>
<aside class="sidebar" id="sidebar" aria-hidden="true">
  <div class="side-head">
    <div class="side-title" data-i18n="side.menu">Menu</div>
    <button class="icon-btn" id="sideClose" aria-label="Close">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M6 6l12 12M18 6L6 18"/></svg>
    </button>
  </div>
  <nav class="side-nav">
    <a class="side-link" href="mailto:support@egamrc.com">
      <div class="side-ico">
        <svg viewBox="0 0 24 24" fill="none" stroke="#a99cff" stroke-width="1.8"><rect x="3" y="5" width="18" height="14" rx="2"/><path d="M3 7l9 7 9-7"/></svg>
      </div>
      <div>
        <b>Support</b>
        <span>support@egamrc.com</span>
      </div>
    </a>
    <a class="side-link" href="https://t.me/egamecom" target="_blank" rel="noopener">
      <div class="side-ico" aria-hidden="true">
        <svg viewBox="0 0 24 24" fill="#2AABEE"><path d="M21.5 4.4 3.7 11.2c-1.2.5-1.2 1.1-.2 1.4l4.6 1.4 1.8 5.4c.2.6.1.9.7.9.4 0 .6-.2.8-.4l2.6-2.5 5.4 4c1 .5 1.7.3 2-.9l3.4-15.2c.4-1.4-.5-2-1.3-1.6zM9.4 14.2l8.8-5.5c.4-.3.8-.1.5.2l-7.5 6.8-.3 3.2-1.5-4.7z"/></svg>
      </div>
      <div>
        <b>Telegram</b>
        <span>t.me/egamecom</span>

<script>
(function () {
'use strict';
const I18N = {};
document.querySelectorAll('script[data-lang]').forEach(el => {
  try { I18N[el.dataset.lang] = JSON.parse(el.textContent); } catch (e) {}
});
let lang = 'zh';
try { const saved = localStorage.getItem('egc_lang'); if (saved && I18N[saved]) lang = saved; } catch (e) {}
function t(key) {
  const d = I18N[lang] || {};
  if (d[key] !== undefined) return d[key];
  return (I18N.en && I18N.en[key] !== undefined) ? I18N.en[key] : key;
}
function applyI18n() {
  document.querySelectorAll('[data-i18n]').forEach(el => { el.textContent = t(el.dataset.i18n); });
  document.documentElement.lang = lang === 'zh' ? 'zh-CN' : 'en';

}

const SFX = {
  ctx: null, muted: false,
  ensure() {
    if (!this.ctx) this.ctx = new (window.AudioContext || window.webkitAudioContext)();
    if (this.ctx.state === 'suspended') this.ctx.resume();
  },
  tone(freq, dur, type, gain, slide) {
    if (this.muted) return;
    this.ensure();
    const t0 = this.ctx.currentTime;
    const o = this.ctx.createOscillator();
    const g = this.ctx.createGain();
    o.type = type || 'sine';
    o.frequency.setValueAtTime(freq, t0);
    if (slide) o.frequency.exponentialRampToValueAtTime(Math.max(40, slide), t0 + dur);
    g.gain.setValueAtTime(gain || 0.08, t0);
    g.gain.exponentialRampToValueAtTime(0.001, t0 + dur);
    o.connect(g); g.connect(this.ctx.destination);
    o.start(t0); o.stop(t0 + dur + 0.02);
  },
  click() { this.tone(620, 0.07, 'triangle', 0.05, 880); },
  eat() { this.tone(520, 0.12, 'sine', 0.08, 980); },
  over() { this.tone(220, 0.28, 'sawtooth', 0.05, 70); },
  merge() { this.tone(340, 0.1, 'triangle', 0.06, 640); },
  hit() { this.tone(760, 0.06, 'square', 0.04, 420); },
  miss() { this.tone(140, 0.08, 'sine', 0.04); },
  good() { this.tone(523, 0.1, 'sine', 0.07); setTimeout(() => this.tone(784, 0.14, 'sine', 0.07), 90); },
  bad() { this.tone(180, 0.12, 'triangle', 0.05, 120); }
};
try { SFX.muted = localStorage.getItem('egc_mute') === '1'; } catch (e) {}
function paintMute() {
  document.getElementById('soundIcon').innerHTML = SFX.muted
    ? '<path d="M4 10v4h3l4 4V6L7 10H4z"/><path d="M16 10l5 5M21 10l-5 5"/>'
    : '<path d="M4 10v4h3l4 4V6L7 10H4z"/><path d="M16 9a4 4 0 010 6M18.5 7a7 7 0 010 10"/>';

document.getElementById('muteBtn').addEventListener('click', () => {
  SFX.muted = !SFX.muted;

function rrect(ctx, x, y, w, h, r) {
  r = Math.min(r, w / 2, h / 2);
  ctx.beginPath();
  ctx.moveTo(x + r, y);
  ctx.arcTo(x + w, y, x + w, y + h, r);
  ctx.arcTo(x + w, y + h, x, y + h, r);
  ctx.arcTo(x, y + h, x, y, r);
  ctx.arcTo(x, y, x + w, y, r);
  ctx.closePath();
}
function store(key, val) {
  try {
    if (val === undefined) {
      const v = localStorage.getItem(key);
      return v === null ? 0 : parseInt(v, 10) || 0;
    }
    localStorage.setItem(key, String(val));
  } catch (e) { return 0; }
}
function secureRandomInt(min, max) {
  const range = max - min + 1;
  const limit = Math.floor(4294967296 / range) * range;
  const buf = new Uint32Array(1);
  let v;
  do { crypto.getRandomValues(buf); v = buf[0]; } while (v >= limit);
  return min + (v % range);
}

const previews = [];
const previewByCanvas = new Map();
function createPreview(canvas, opts) {
  const p = { canvas, ctx: canvas.getContext('2d'), w: 0, h: 0, visible: true, state: opts.init(), update: opts.update, draw: opts.draw };
  previews.push(p);
  previewByCanvas.set(canvas, p);
  resizePreview(p);
  return p;
}
function resizePreview(p) {
  const rect = p.canvas.getBoundingClientRect();
  if (!rect.width || !rect.height) return;
  const dpr = Math.min(window.devicePixelRatio || 1, 2);

  p.canvas.width = Math.round(rect.width * dpr);
  p.canvas.height = Math.round(rect.height * dpr);
  p.ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
}
function stars(ctx, w, h, t) {
  ctx.fillStyle = 'rgba(255,255,255,.55)';
  for (let i = 0; i < 28; i++) {
    const x = (i * 97 + Math.sin(t + i) * 12) % w;
    const y = (i * 53) % h;
    ctx.globalAlpha = 0.25 + (i % 5) * 0.12;
    ctx.beginPath(); ctx.arc(x, y, i % 4 === 0 ? 1.6 : 0.8, 0, Math.PI * 2); ctx.fill();
  }
  ctx.globalAlpha = 1;
}

createPreview(document.querySelector('[data-preview="snake"]'), {
  init: () => ({ t: 0 }),
  update: (s, dt) => { s.t += dt; },
  draw: (ctx, w, h, s) => {
    const g = ctx.createLinearGradient(0, 0, w, h);
    g.addColorStop(0, '#12122a'); g.addColorStop(1, '#090914');
    ctx.fillStyle = g; ctx.fillRect(0, 0, w, h);
    stars(ctx, w, h, s.t);
    const pts = [];
    const n = 22;
    for (let i = 0; i < n; i++) {
      const p = i / (n - 1);
      pts.push({
        x: w * (0.12 + p * 0.76),
        y: h * 0.5 + Math.sin(s.t * 1.6 + p * 5.2) * h * 0.22

    ctx.strokeStyle = 'rgba(124,92,255,.25)'; ctx.lineWidth = 28;
    ctx.beginPath(); pts.forEach((p, i) => i ? ctx.lineTo(p.x, p.y) : ctx.moveTo(p.x, p.y)); ctx.stroke();
    const grd = ctx.createLinearGradient(pts[0].x, pts[0].y, pts[n - 1].x, pts[n - 1].y);
    grd.addColorStop(0, '#7c5cff'); grd.addColorStop(1, '#00e5ff');
    ctx.strokeStyle = grd; ctx.lineWidth = 16;
    ctx.shadowColor = '#7c5cff'; ctx.shadowBlur = 18;
    ctx.beginPath(); pts.forEach((p, i) => i ? ctx.lineTo(p.x, p.y) : ctx.moveTo(p.x, p.y)); ctx.stroke();
    ctx.shadowBlur = 0;
    const head = pts[n - 1];
    ctx.fillStyle = '#eaffff';
    ctx.beginPath(); ctx.arc(head.x, head.y, 8, 0, Math.PI * 2); ctx.fill();
    const fx = w * 0.78, fy = h * 0.32 + Math.sin(s.t * 3) * 6;
    ctx.fillStyle = '#ff4d9d'; ctx.shadowColor = '#ff4d9d'; ctx.shadowBlur = 18;
    ctx.beginPath(); ctx.arc(fx, fy, 8 + Math.sin(s.t * 5) * 1.5, 0, Math.PI * 2); ctx.fill();
    ctx.shadowBlur = 0;
  }
});

createPreview(document.querySelector('[data-preview="2048"]'), {
  init: () => ({ t: 0 }),
  update: (s, dt) => { s.t += dt; },
  draw: (ctx, w, h, s) => {
    ctx.fillStyle = '#12121c'; ctx.fillRect(0, 0, w, h);
    const tiles = [[2, 8, 16, 4], [32, 64, 2, 128], [4, 256, 8, 16], [2, 4, 32, 512]];
    const size = Math.min(w - 36, h - 28);
    const cell = size / 4;
    const ox = (w - size) / 2, oy = (h - size) / 2;
    ctx.fillStyle = 'rgba(255,255,255,.05)';

      const v = tiles[r][c];
      const lift = Math.sin(s.t * 2 + r + c) * 2;
      const x = ox + c * cell + 5, y = oy + r * cell + 5 + lift;
      ctx.fillStyle = 'rgba(0,0,0,.28)';
      rrect(ctx, x + 3, y + 6, cell - 10, cell - 10, 8); ctx.fill();
      ctx.fillStyle = colors[v];
      rrect(ctx, x, y, cell - 10, cell - 10, 8); ctx.fill();
    }
  }
});

createPreview(document.querySelector('[data-preview="reaction"]'), {
  init: () => ({ t: 0 }),
  update: (s, dt) => { s.t += dt; },
  draw: (ctx, w, h, s) => {

    playing = false; clearInterval(tickTimer); SFX.over();
    if (currentTarget) { currentTarget.remove(); currentTarget = null; }
    const total = hits + misses, acc = total ? Math.round(hits / total * 100) : 0, avg = hits ? Math.round(reactionSum / hits) : 0;
    overlay.classList.remove('hidden');
    overlay.innerHTML = '<p style="font-size:17px;font-weight:800;color:#fff">' + t('aim.done') + '</p><p>' + t('aim.hits') + ' <b style="color:#5ef0a0">' + hits + '</b> · ' + t('aim.acc') + ' <b style="color:#8ef0ff">' + acc + '%</b> · ' + t('aim.avg') + ' <b style="color:#a99cff">' + avg + ' ms</b></p><button class="btn-primary" id="aStart">' + t('aim.again') + '</button>';
    overlay.querySelector('#aStart').addEventListener('click', start);
  }
  root.querySelector('#aStart').addEventListener('click', start);
  stage.addEventListener('pointerdown', onStageDown);
  return function destroy() { alive = false; playing = false; clearInterval(tickTimer); stage.removeEventListener('pointerdown', onStageDown); };
};

GAMES.guess = function (root) {
  root.innerHTML =
    '<div class="guess-box"><div class="guess-range">' + t('guess.range') + '</div>' +
    '<p style="color:var(--muted);font-size:13.5px;line-height:1.6;margin-bottom:16px">' + t('guess.prompt') + '</p>' +
    '<div class="guess-input-row"><input class="guess-input" id="gInput" type="number" inputmode="numeric" min="1" max="100" placeholder="' + t('guess.placeholder') + '">' +
    '<button class="btn-primary" id="gBtn">' + t('guess.submit') + '</button></div>' +
    '<div class="guess-feedback" id="gFb"></div><div class="guess-history" id="gHist"></div>' +
    '<div style="margin-top:18px"><button class="btn-ghost" id="gNew">' + t('guess.newGame') + '</button></div>' +
    '<p class="game-hint">' + t('guess.seed') + '</p></div>';
  const input = root.querySelector('#gInput'), btn = root.querySelector('#gBtn'), fb = root.querySelector('#gFb'), hist = root.querySelector('#gHist');
  let secret = secureRandomInt(1, 100), attempts = 0, solved = false;
  function reset() {
    secret = secureRandomInt(1, 100); attempts = 0; solved = false;
    fb.textContent = ''; fb.className = 'guess-feedback'; hist.innerHTML = '';
    input.value = ''; input.disabled = false; btn.disabled = false; input.focus();
  }
  function addChip(n, dir) {
    const chip = document.createElement('span');
    chip.className = 'gh-chip ' + dir;
    chip.textContent = n + (dir === 'up' ? ' ↑' : ' ↓');
    hist.appendChild(chip);
  }
  function submit() {
    if (solved) return;
    const n = Number(input.value.trim());
    if (!Number.isInteger(n) || n < 1 || n > 100) { fb.textContent = t('guess.invalid'); fb.className = 'guess-feedback err'; SFX.bad(); return; }
    attempts++; input.value = ''; input.focus();
    if (n === secret) {
      solved = true; SFX.good();
      fb.textContent = t('guess.correct') + ' ' + t('guess.attempts') + ': ' + attempts;
      fb.className = 'guess-feedback win';
      const chip = document.createElement('span'); chip.className = 'gh-chip'; chip.style.color = '#5ef0a0'; chip.textContent = n; hist.appendChild(chip);
      input.disabled = true; btn.disabled = true;
    } else if (n < secret) { fb.textContent = t('guess.low'); fb.className = 'guess-feedback low'; addChip(n, 'up'); SFX.tone(420, 0.08, 'sine', 0.05, 560); }
    else { fb.textContent = t('guess.high'); fb.className = 'guess-feedback high'; addChip(n, 'down'); SFX.tone(280, 0.08, 'sine', 0.05, 180); }
  }
  btn.addEventListener('click', submit);
  input.addEventListener('keydown', e => { if (e.key === 'Enter') submit(); });
  root.querySelector('#gNew').addEventListener('click', () => { SFX.click(); reset(); });
  setTimeout(() => input.focus(), 60);
  return function destroy() {};
};

applyI18n();
})();
</script>
