<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>可缩放内嵌网页</title>
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: system-ui, -apple-system, sans-serif;
    background: #f5f5f5;
  }
  .toolbar {
    padding: 12px 16px;
    background: #fff;
    border-bottom: 1px solid #ddd;
    display: flex;
    gap: 10px;
    align-items: center;
    flex-wrap: wrap;
  }
  button {
    padding: 8px 16px;
    font-size: 14px;
    cursor: pointer;
    border: 1px solid #ccc;
    background: #fff;
    border-radius: 6px;
  }
  button:hover { background: #f0f0f0; }
  #zoomInfo {
    font-size: 14px;
    color: #555;
    min-width: 70px;
  }
  .container {
    width: 100%;
    height: calc(100vh - 60px);
    overflow: auto;
    background: #eee;
    position: relative;
  }
  .iframe-wrapper {
    transform-origin: top left;
  }
  iframe {
    display: block;
    border: none;
    width: 100%;
    height: 100%;
    min-width: 800px;
    min-height: 600px;
  }
</style>
</head>
<body>

<div class="toolbar">
  <button id="zoomIn">放大 +</button>
  <button id="zoomOut">缩小 −</button>
  <button id="reset">重置</button>
  <span id="zoomInfo">100%</span>
</div>

<div class="container" id="container">
  <div class="iframe-wrapper" id="wrapper">
    <iframe 
      id="iframe" 
      src="https://www.004x6.com/?id=658131037"
      frameborder="0"
      allowfullscreen>
    </iframe>
  </div>
</div>

<script>
const wrapper = document.getElementById('wrapper');
const iframe = document.getElementById('iframe');
const container = document.getElementById('container');
const zoomInfo = document.getElementById('zoomInfo');

let scale = 1;
const minScale = 0.3;
const maxScale = 3;
const step = 0.1;

function updateScale() {
  scale = Math.max(minScale, Math.min(maxScale, scale));
  wrapper.style.transform = `scale(${scale})`;

  // 反向放大 wrapper，保证放大后可正常滚动，不会失控
  const containerWidth = container.clientWidth;
  const containerHeight = container.clientHeight;
  wrapper.style.width = `${containerWidth / scale}px`;
  wrapper.style.height = `${containerHeight / scale}px`;

  zoomInfo.textContent = Math.round(scale * 100) + '%';
}

function zoomIn() {
  scale += step;
  updateScale();
}
function zoomOut() {
  scale -= step;
  updateScale();
}
function resetZoom() {
  scale = 1;
  updateScale();
}

document.getElementById('zoomIn').onclick = zoomIn;
document.getElementById('zoomOut').onclick = zoomOut;
document.getElementById('reset').onclick = resetZoom;

// 滚轮缩放
container.addEventListener('wheel', (e) => {
  e.preventDefault();
  if (e.deltaY < 0) {
    zoomIn();
  } else {
    zoomOut();
  }
}, { passive: false });

window.addEventListener('resize', updateScale);
updateScale();
</script>

</body>
</html>
